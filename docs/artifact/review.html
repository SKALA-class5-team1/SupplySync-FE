<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RFQ 검토 콘솔</title>
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F5; --surface:#FFFFFF; --paper:#FBFCFD; --ink:#1A2433; --muted:#56637A; --faint:#8A95A8;
  --line:#D5DCE6; --line-soft:#E8EDF3;
  --accent:#22385E; --accent-ink:#FFFFFF; --accent-soft:#E4EAF3; --slate:#5B6B86;
  --high:#1F3560; --high-soft:#DDE5F1; --med:#5E6B7E; --med-soft:#ECEFF4;
  --opt:#3F6B8C; --opt-soft:#E1ECF4; --ok:#2E6A58; --ok-soft:#DFEEE8;
  --f:"Apple SD 산돌고딕 Neo","Apple SD Gothic Neo",sans-serif;
  --shadow:0 1px 2px rgba(20,32,51,.05),0 6px 20px rgba(20,32,51,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1420; --surface:#161F2E; --paper:#1A2536; --ink:#E4E9F2; --muted:#A3AEBF; --faint:#7C879A;
  --line:#2A364A; --line-soft:#1F2A3C;
  --accent:#9DB3DE; --accent-ink:#0E1420; --accent-soft:#1E2C44; --slate:#7A8BA8;
  --high:#C5D5F0; --high-soft:#24344F; --med:#A9B4C4; --med-soft:#222C3C;
  --opt:#8DBBD9; --opt-soft:#1C3142; --ok:#7CC4AE; --ok-soft:#18332B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1420; --surface:#161F2E; --paper:#1A2536; --ink:#E4E9F2; --muted:#A3AEBF; --faint:#7C879A;
  --line:#2A364A; --line-soft:#1F2A3C;
  --accent:#9DB3DE; --accent-ink:#0E1420; --accent-soft:#1E2C44; --slate:#7A8BA8;
  --high:#C5D5F0; --high-soft:#24344F; --med:#A9B4C4; --med-soft:#222C3C;
  --opt:#8DBBD9; --opt-soft:#1C3142; --ok:#7CC4AE; --ok-soft:#18332B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25)}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.55}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:0}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.shell{display:grid;grid-template-columns:64px 272px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:14px}
.orb{width:34px;height:34px;border-radius:9px;border:0;padding:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;margin-bottom:12px}
.ri{width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--muted);display:grid;place-items:center}
.ri svg.i{width:21px;height:21px}
.ri:hover{background:var(--line-soft)}
.ri[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.rail hr{width:36px;border:0;border-top:1px solid var(--line);margin:6px 0}
.me{margin-top:auto;width:38px;height:38px;border-radius:50%;background:var(--slate);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.side-brand{padding:18px 22px;border-bottom:1px solid var(--line);display:grid;gap:3px}
.wm{font-size:20px;font-weight:700;letter-spacing:-.01em}
.ct{font-size:14px;font-weight:600;margin-top:4px}
.cs{font-size:12.5px;color:var(--muted)}
.pill-soft{justify-self:start;margin-top:8px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:14px}
.vsteps{list-style:none;margin:0;padding:16px 16px 8px;display:grid;gap:6px}
.vsteps button{border:1px solid transparent;background:none;width:100%;display:flex;gap:10px;align-items:center;padding:8px;border-radius:9px;text-align:left}
.vsteps button:hover:not(:disabled){background:var(--line-soft)}
.vsteps li.cur>button{background:var(--accent-soft);border-color:var(--accent-soft)}
.vc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);font-size:12px;font-weight:600;color:var(--muted)}
.vsteps li.done .vc{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.vsteps li.cur .vc{border-color:var(--accent);color:var(--accent)}
.vl{display:flex;flex-direction:column;min-width:0}
.vl small{font-size:11.5px;color:var(--faint)}
.vl b{font-size:13.5px;font-weight:600}
.nodes{list-style:none;margin:0 0 6px 46px;padding:0;display:grid;gap:2px}
.nodes li{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center}
.nodes li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--line);flex:none}
.nodes li.done{color:var(--ink)} .nodes li.done::before{background:var(--ok)}
.nodes li.run{color:var(--accent);font-weight:500} .nodes li.run::before{background:var(--accent)}
.nodes li.wait{color:var(--med);font-weight:600} .nodes li.wait::before{background:var(--med)}
.logbox{margin:auto 16px 16px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;display:flex;flex-direction:column;min-height:0}
.logbox h2{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0 0 8px}
.log{list-style:none;margin:0;padding:0;font-size:12px;max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.log li{display:flex;gap:8px;color:var(--muted)}
.log li .t{flex:none;font-variant-numeric:tabular-nums}
.log li.w{color:var(--med);font-weight:600} .log li.ok{color:var(--ok)}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
@keyframes blink{50%{opacity:.25}}
.blink{animation:blink 1s infinite}

/* main */
.wrap{min-width:0;padding:20px 24px 40px}
.head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--faint);font-weight:600}
.head h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--line-soft);color:var(--muted);white-space:nowrap}
.tag.sample{border:1px dashed var(--line);background:none}
.hact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.run{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.pill.wait{color:var(--med);border-color:var(--med);background:var(--med-soft)}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.ws{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:16px;align-items:start}
.ws.single{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.ws{grid-template-columns:minmax(0,1fr)}}

/* buttons, panels */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.panel h3{font-size:16px;font-weight:700}
.lead{color:var(--muted);margin:4px 0 14px;font-size:13px}
.sec{border-top:1px solid var(--line-soft);padding-top:14px;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3 .sub{font-weight:400;font-size:12.5px;color:var(--muted)}
.sec-t{font-size:11.5px;letter-spacing:.06em;color:var(--faint);font-weight:600}
.verdict{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.verdict .lbl{font-size:11.5px;letter-spacing:.06em;color:var(--accent);font-weight:600}
.verdict p{margin:2px 0 0;font-size:15px;font-weight:600}
.verdict.pending{border-style:dashed;border-color:var(--line);background:none}
.verdict.pending .lbl{color:var(--muted)} .verdict.pending p{color:var(--muted);font-weight:400}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.kv div{background:var(--surface);padding:9px 12px}
.kv dt{font-size:11.5px;color:var(--muted)} .kv dd{margin:0;font-weight:600}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{font-size:12px;font-weight:500;color:var(--muted);background:var(--paper);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.hlc{background:var(--accent-soft)}
th.hlc{color:var(--accent);background:var(--accent-soft)}
tr.bad td{background:var(--high-soft)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap}
.b-high{color:var(--surface);background:var(--high)}
.b-med{color:var(--med);background:var(--med-soft)}
.b-ok{color:var(--ok);background:var(--ok-soft)}
.b-acc{color:var(--accent);background:var(--accent-soft)}
.chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;white-space:nowrap}
.chip.HIGH{background:var(--high);color:var(--surface)}
.chip.MED{background:var(--med-soft);color:var(--med)}
.chip.옵션{background:var(--opt-soft);color:var(--opt)}
.m{font-weight:700;margin-right:4px}
.m.ok{color:var(--ok)} .m.opt{color:var(--opt)} .m.no{color:var(--muted)}
.ev{border:1px solid var(--line);background:none;color:var(--accent);font-size:11.5px;padding:1px 8px;border-radius:999px}
.ev:hover{border-color:var(--accent)}
.ev.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.done-line{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ok);font-weight:600}
.done-line svg{color:var(--ok)}
.qlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.risks{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.risk{border:1px solid var(--line);border-left:3px solid var(--slate);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.risk b{font-size:13.5px}
.risk span{font-size:12.5px;color:var(--muted)}
.confirm{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm .lbl{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.confirm p{margin:0;font-weight:600}
.confirm ul{margin:0;padding-left:18px}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm .msg{font-size:12.5px;color:var(--muted);margin:0;font-weight:400}

/* paper */
.docwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);position:sticky;top:16px}
.dochead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dochead .fn{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.dochead .fn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.4}
.evbox{border-bottom:1px solid var(--line-soft);padding:10px 14px;background:var(--surface);min-height:58px;font-size:13px}
.evbox .ehead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.evbox .judge{margin:4px 0 0}
.evbox .src{font-size:11.5px;color:var(--muted);margin-top:6px}
.evbox .ev-t{margin:2px 0 0;font-size:12.5px;color:var(--ink)}
.doc{background:var(--paper);max-height:calc(100vh - 190px);overflow:auto;padding:22px 24px 30px;font-size:13.5px}
.doc h2{font-size:18px;font-weight:700;margin:4px 0 2px}
.doc h3{font-size:14px;font-weight:700;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.doc .rfqno{font-size:12px;color:var(--muted)}
.mt,.pt{width:100%;margin-bottom:4px}
.mt th,.pt th{width:30%;background:none;color:var(--muted);font-weight:500}
.mt td,.pt td{font-size:13px}
.mt th,.mt td,.pt th,.pt td{border-bottom:1px solid var(--line-soft)}
.doc ul{margin:4px 0;padding-left:18px}
.doc li{margin:2px 0}
.hl{cursor:pointer;border-radius:2px;background:linear-gradient(transparent 58%,var(--c-soft) 58%);box-shadow:inset 0 -2px 0 var(--c);transition:background .15s}
.hl:hover,.hl.sel{background:var(--c-soft)}
.hl.core{--c:var(--high);--c-soft:var(--high-soft)}
.hl.check{--c:var(--slate);--c-soft:var(--med-soft)}
.hl.opt{--c:var(--opt);--c-soft:var(--opt-soft)}
.hl.fixed{--c:var(--ok);--c-soft:var(--ok-soft)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;font-size:12.5px;color:var(--muted)}

/* panel-specific */
.bar{position:relative;height:26px;display:flex;border-radius:6px;background:var(--line-soft)}
.bar div{height:100%}
.bar .s1{background:var(--accent);border-radius:6px 0 0 6px}
.bar .s2{background:color-mix(in srgb,var(--accent) 60%,var(--surface))}
.bar .s3{background:color-mix(in srgb,var(--accent) 35%,var(--surface))}
.bar .tgt{position:absolute;top:-6px;bottom:-6px;border-left:2px solid var(--ink)}
.bar .tgt span{position:absolute;left:6px;top:-18px;font-size:11.5px;white-space:nowrap}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.quote{border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--paper);display:flex;flex-direction:column;gap:12px}
.quote .qh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px}
.quote .qh b{font-size:16px;letter-spacing:.2em}
.quote .cond{border:1px dashed var(--slate);border-radius:8px;padding:10px 12px;background:var(--surface)}
.quote .cond ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.tl{position:relative;height:118px;margin:4px 10px}
.tl .axis{position:absolute;left:0;right:0;top:58px;height:2px;background:var(--line)}
.tl .mk{position:absolute;top:0;bottom:0;width:0}
.tl .mk i{position:absolute;left:-6px;top:52px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .mk.good i{border-color:var(--ok);background:var(--ok)}
.tl .mk.crit i{border-color:var(--high);background:var(--high)}
.tl .mk.late i{border-color:var(--med);background:var(--surface)}
.tl .mk.crit::after{content:"";position:absolute;left:-1px;top:8px;bottom:8px;border-left:2px dashed var(--slate)}
.tl .mk span{position:absolute;white-space:nowrap;font-size:12px;line-height:1.3;transform:translateX(-50%)}
.tl .mk span.up{bottom:70px} .tl .mk span.dn{top:72px}
.tl .mk span b{display:block;font-weight:600}
.tl .mk span em{font-style:normal;color:var(--muted)}
.tl .mk.edge-l span{transform:none} .tl .mk.edge-r span{transform:translateX(-100%)}
.stamp{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper)}
.sealmark{width:84px;height:84px;border-radius:50%;border:3px solid var(--accent);color:var(--accent);display:grid;place-items:center;text-align:center;font-weight:700;font-size:14px;line-height:1.25;transform:rotate(-8deg);flex:none}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flow div{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;background:var(--paper)}
.flow b{display:block;font-size:13px;margin-bottom:2px}
@media (max-width:760px){.flow{grid-template-columns:minmax(0,1fr)}}
.agents-foot{font-size:12px;color:var(--faint)}

.foot{color:var(--faint);font-size:12px;margin-top:18px}
.foot code{font-size:11.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1100px){
  .shell{grid-template-columns:64px minmax(0,1fr)}
  .side{display:none}
}
@media (max-width:620px){
  .shell{grid-template-columns:52px minmax(0,1fr)}
  .rail{padding-block:10px}
  .ri{width:38px;height:38px}
  .wrap{padding:14px 12px 32px}
  .doc{max-height:560px;padding:18px 14px}
  .docwrap{position:static}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="주 메뉴">
    <button class="orb" data-rail="ws" title="워크스페이스">RA</button>
    <button class="ri" id="rail-ws" data-rail="ws" aria-pressed="true" title="검토 워크스페이스"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button>
    <button class="ri" id="rail-data" data-rail="data" aria-pressed="false" title="데이터 구조"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg></button>
    <hr>
    <div class="me" title="영업 담당">담당</div>
  </aside>

  <aside class="side" aria-label="검토 단계">
    <div class="side-brand">
      <div class="wm">RFQ Agent</div>
      <div class="ct">한별모터스 · 전동식 워터펌프</div>
      <div class="cs">대성오토텍 영업팀 · 요청서 검토</div>
      <span class="pill-soft">Human-in-the-loop · 사내 규정 RAG</span>
    </div>
    <ol class="vsteps" id="vsteps"></ol>
    <div class="logbox">
      <h2>실행 로그</h2>
      <ol class="log" id="log"></ol>
    </div>
  </aside>

  <main class="wrap" id="app"></main>
</div>

function fresh(){ return {idx:0, started:false, running:null, waiting:null, done:new Set(), view:'intro', lastSg:1, finished:false, sel:null, ev:null, asm:false, msg:{}, log:[]}; }
let S = fresh();
let timer = null;
const has = n => S.done.has(n);
const sgState = sg => {
  const nodes = SCRIPT.filter(s=>s.sg===sg);
  if (S.waiting && S.waiting.sg===sg) return 'wait';
  if (nodes.every(n=>has(n.node))) return 'done';
  if (S.running && S.running.sg===sg) return 'run';
  if (nodes.some(n=>has(n.node))) return 'run';
  return 'idle';
};
const stamp = () => new Date().toTimeString().slice(0,8);
function log(text, cls=''){ S.log.unshift({t:stamp(), text, cls}); }

/* ===================== 이벤트 처리 (백엔드 연결 지점) ===================== */
function handleEvent(evt){
  const step = SCRIPT.find(s=>s.sg===evt.sg && s.node===evt.node);
  if(!step) return;
  S.started = true;
  if(evt.status==='running'){
    S.running = step; S.lastSg = step.sg;
    if(S.view==='intro' || typeof S.view==='number') S.view = step.sg;
    log(`SG${step.sg} · ${step.label} 시작`);
  }
  if(evt.status==='interrupt'){ S.running=null; S.waiting=step; if(typeof S.view==='number' || S.view==='intro') S.view=step.sg; log(`SG${step.sg} · ${step.label} 대기`,'w'); }
  if(evt.status==='done'){
    S.done.add(step.node); S.running=null; if(S.waiting===step) S.waiting=null;
    log(`SG${step.sg} · ${step.label} 완료`,'ok');
    if(SCRIPT.filter(s=>s.sg===step.sg).every(s=>has(s.node))) log(`SG${step.sg} ${SG_NAMES[step.sg]} 완료`,'ok');
    if(step.node==='register_quote') S.finished = true;
  }
  render();
}
window.handleEvent = handleEvent;

/* ===================== 목업 실행기 ===================== */
const DELAY = 750;
function runNext(){
  if(S.idx>=SCRIPT.length) return;
  const step = SCRIPT[S.idx];
  handleEvent({sg:step.sg,node:step.node,status:'running'});
  timer = setTimeout(()=>{
    if(step.interrupt){ handleEvent({sg:step.sg,node:step.node,status:'interrupt'}); return; }
    handleEvent({sg:step.sg,node:step.node,status:'done'});
    S.idx++; runNext();
  }, DELAY);
}
function resume(){
  const step = S.waiting; if(!step) return;
  handleEvent({sg:step.sg,node:step.node,status:'done'});
  S.idx++; runNext();
}

function hv(id, orig){
  const d = HL[id];
  if(!S.started) return orig;
  const confirmed = has('human_confirm');
  const cls = confirmed && d.asm ? 'fixed' : d.cls;
  const txt = S.asm && confirmed && d.asm ? d.asm : orig;
  return `<span class="hl ${cls}${S.sel===id?' sel':''}" data-risk="${id}" role="button" tabindex="0">${txt}</span>`;
}

/* ===================== 좌측 단계 (SG + 노드) ===================== */
function renderSteps(){
  document.getElementById('vsteps').innerHTML = [1,2,3,4].map(sg=>{
    const st = sgState(sg);
    const cur = S.view===sg;
    const nodes = SCRIPT.filter(s=>s.sg===sg).map(s=>{
      const c = has(s.node)?'done':(S.waiting===s?'wait':(S.running===s?'run':''));
      return `<li class="${c}">${s.label}</li>`;
    }).join('');
    return `<li class="${st==='done'?'done':''}${cur?' cur':''}">
      <button data-sgstep="${sg}" ${st==='idle'?'disabled':''} aria-current="${cur?'step':'false'}">
        <span class="vc">${st==='done'?ic('check','style="width:14px;height:14px"'):sg}</span>
        <span class="vl"><small>${{idle:'대기',run:'진행 중',wait:'확인 필요',done:'완료'}[st]}</small><b>SG${sg} ${SG_NAMES[sg]}</b></span>
      </button>
      <ul class="nodes">${nodes}</ul></li>`;
  }).join('');
}
function renderLog(){
  document.getElementById('log').innerHTML = S.log.length
    ? S.log.map(l=>`<li class="${l.cls}"><span class="t">${l.t}</span><span>${l.text}</span></li>`).join('')

}

/* ===================== 렌더 ===================== */
function render(){
  const app = document.getElementById('app');
  const docEl = document.getElementById('doc');
  const keep = docEl ? docEl.scrollTop : 0;
  const isData = S.view==='data';
  const panel = isData ? dataHTML()
    : S.view==='intro' ? introHTML()
    : [null,sg1,sg2,sg3,sg4][S.view]();
  app.innerHTML = `${headHTML()}
    <div class="ws${isData?' single':''}">
      ${isData ? '' : docBox()}
      <section class="panel" aria-live="polite">${panel}</section>
    </div>
    <p class="foot">데모 데이터: rfq_dataset 기준 목업 · 회사명·제품명·수치는 모두 가상 · 백엔드 연결 시 노드 이벤트를 <code>window.handleEvent({sg, node, status})</code>로 넘기면 같은 화면이 갱신됩니다 (status: running / done / interrupt).</p>`;
  const d = document.getElementById('doc'); if(d) d.scrollTop = keep;
  document.getElementById('rail-ws').setAttribute('aria-pressed', String(!isData));
  document.getElementById('rail-data').setAttribute('aria-pressed', String(isData));
  renderSteps();
  renderLog();
}

/* ===================== 입력 ===================== */
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function selectQ(){ const el=document.getElementById('qlist'); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

document.addEventListener('click', e=>{
  const rail = e.target.closest('[data-rail]');
  if(rail){
    if(rail.dataset.rail==='data'){ S.view='data'; }
    else { S.view = S.started ? S.lastSg : 'intro'; }
    render(); return;
  }
  const sgb = e.target.closest('[data-sgstep]'); if(sgb && !sgb.disabled){ S.view=+sgb.dataset.sgstep; render(); return; }
  const dv = e.target.closest('[data-docview]'); if(dv && !dv.disabled){ S.asm = dv.dataset.docview==='asm'; render(); return; }
  const ev = e.target.closest('[data-ev]'); if(ev){ S.ev = S.ev===ev.dataset.ev ? null : ev.dataset.ev; S.sel=null; render(); return; }
  const hl = e.target.closest('[data-risk]'); if(hl){
    const id = hl.dataset.risk;
    if(S.sel===id){ S.sel=null; S.ev=null; } else { S.sel=id; S.ev=HL[id].ev; }
    render(); return;
  }
  if(e.target.closest('[data-start]')){
    if(S.started) return;
    log('RFQ HB-EV7-EWP-001 검토 시작'); S.view=1; runNext(); render(); return;
  }
  if(e.target.closest('[data-reset]')){ clearTimeout(timer); S=fresh(); render(); return; }
  const a = e.target.closest('[data-act]'); if(!a) return;
  const act = a.dataset.act;
  if(act==='approve1'||act==='approve4'){ log(act==='approve1' ? '담당자: 22 L/min 가정 승인' : '담당자: 견적 승인','ok'); toast(act==='approve1'?'22 L/min으로 검토를 이어갑니다':'견적을 승인했습니다'); resume(); return; }
  if(act==='alt1'){ S.msg.alt1=true; render(); return; }
  if(act==='rej4'){ S.msg.rej4=true; render(); return; }
  if(act==='copyq'){
    const text=[...document.querySelectorAll('#qlist li')].map((li,i)=>`${i+1}. ${li.textContent}`).join('\n');
    const done=()=>{ S.msg.copied=true; render(); };
    try{ navigator.clipboard.writeText(text).then(done).catch(()=>{ selectQ(); }); }catch(_){ selectQ(); }
  }
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-risk]')){ e.preventDefault(); e.target.click(); }
});

render();
